# >>> i3status theme (managed by themes/theme-switcher.sh — do not edit) >>>
# Tokyo Night is not bundled with i3status-rs, so the palette is spelled out here.
[theme]
theme = "plain"
[theme.overrides]
idle_bg = "#1a1b26"
idle_fg = "#c0caf5"
info_bg = "#7aa2f7"
info_fg = "#1a1b26"
good_bg = "#9ece6a"
good_fg = "#1a1b26"
warning_bg = "#e0af68"
warning_fg = "#1a1b26"
critical_bg = "#f7768e"
critical_fg = "#c0caf5"
separator = "\ue0b2"
separator_bg = "auto"
separator_fg = "auto"
# <<< i3status theme <<<

[icons]
icons = "material-nf" # Nerd Font glyphs (provided by JetBrainsMono Nerd Font, already required by this setup)

# Blocks are laid out left to right in declaration order and pushed against the
# right edge of the bar: system stats first, clock and tray last.

# Pending apt updates. i3status-rs keeps its own package database under
# /tmp/i3rs-apt, so this never needs root and never touches the system lists.
[[block]]
block = "packages"
package_manager = ["apt"]
interval = 3600
format = " $icon $total "
warning_updates_regex = "(linux|linux-lts|linux-zen)"
critical_updates_regex = "(zorin|nvidia)"
[[block.click]]
button = "left"
cmd = "wezterm start -- sh -c 'sudo apt update && sudo apt upgrade; read -r -p \"Enter para fechar\"'"

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
format = "$icon Disk: $available"
interval = 20
[[block.click]]
button = "left"
cmd = "xdg-open $HOME"

[[block]]
block = "memory"
format = " $icon $mem_used.eng(prefix:Mi)/$mem_total.eng(prefix:Mi)($mem_used_percents.eng(w:2)) "
format_alt = " MEMORY LOW: $mem_free "
interval = 5
warning_mem = 70
critical_mem = 90
[[block.click]]
button = "left"
cmd = "wezterm start -- btop"

[[block]]
block = "cpu"
format = "$icon $utilization "
format_alt = " CPU: $utilization "
interval = 5
[[block.click]]
button = "left"
cmd = "wezterm start -- btop"

# GPU block requires nvidia-smi to be installed and in PATH
[[block]]
block = "nvidia_gpu"
format = "$icon $utilization/$temperature "
interval = 5
[[block.click]]
button = "left"
cmd = "wezterm start -- watch -n1 nvidia-smi"

[[block]]
block = "net"
# No "device" set: the block auto-detects the interface of the default route.
# Pin it with e.g. device = "enp7s0" if auto-detection picks the wrong one.
format = "$icon ED: $graph_down($speed_down) "
format_alt = "$icon EU: $graph_up($speed_up) "
interval = 5
[[block.click]]
button = "left"
cmd = "~/.local/bin/rofi_wifi.sh"
[[block.click]]
button = "right"
cmd = "nm-connection-editor"

[[block]]
block = "weather"
autolocate = true
format = " $icon $weather ($location) $temp "
[block.service]
name = "metno"

[[block]]
block = "sound"
step_width = 3
[[block.click]]
button = "right"
cmd = "pavucontrol"

# Do-not-disturb indicator: left click pauses/resumes dunst, right click
# reopens the notification history.
[[block]]
block = "notify"
driver = "dunst"
format = " $icon {($notification_count.eng(w:1)) |}"
[[block.click]]
button = "left"
action = "toggle_paused"
[[block.click]]
button = "right"
cmd = "~/.local/bin/dunst-history.sh"

[[block]]
block = "time"
interval = 1
[block.format]
full = " $icon $timestamp.datetime(f:'%a %d-%m-%Y %R:%S', l:pt_BR) "
short = " $icon $timestamp.datetime(f:%R) "
[[block.click]]
button = "left"
cmd = "eww open --toggle dashboard"

[[block]]
block = "menu"
text = "   "
[[block.items]]
display = " -&gt;   Lock    &lt;-"
cmd = "loginctl lock-session"
[[block.items]]
display = " -&gt;   Sleep   &lt;-"
cmd = "systemctl suspend"
[[block.items]]
display = " -&gt; Power Off &lt;-"
cmd = "poweroff"
confirm_msg = "Are you sure you want to power off?"
[[block.items]]
display = " -&gt;  Reboot   &lt;-"
cmd = "reboot"
confirm_msg = "Are you sure you want to reboot?"
