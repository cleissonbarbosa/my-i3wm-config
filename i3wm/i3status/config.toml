[theme]
theme = "dracula"

[icons]
icons = "material-nf" # Nerd Font glyphs (provided by JetBrainsMono Nerd Font, already required by this setup)

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
format = "$icon Disk: $available"
interval = 20

[[block]]
block = "memory"
format = " $icon $mem_used.eng(prefix:Mi)/$mem_total.eng(prefix:Mi)($mem_used_percents.eng(w:2)) "
format_alt = " MEMORY LOW: $mem_free "
interval = 5
warning_mem = 70
critical_mem = 90

[[block]]
block = "cpu"
format = "$icon $utilization "
format_alt = " CPU: $utilization "
interval = 5

# GPU block requires nvidia-smi to be installed and in PATH
[[block]]
block = "nvidia_gpu"
format = "$icon $utilization/$temperature "
interval = 5

[[block]]
block = "net"
# No "device" set: the block auto-detects the interface of the default route.
# Pin it with e.g. device = "enp7s0" if auto-detection picks the wrong one.
format = "$icon ED: $graph_down($speed_down) "
format_alt = "$icon EU: $graph_up($speed_up) "
interval = 5

[[block]]
block = "time"
interval = 1
[block.format]
full = " $icon $timestamp.datetime(f:'%a %d-%m-%Y %R:%S', l:pt_BR) "
short = " $icon $timestamp.datetime(f:%R) "

[[block]]
block = "sound"
step_width = 3

[[block]]
block = "weather"
autolocate = true
format = " $icon $weather ($location) $temp "
[block.service]
name = "metno"
#lang = "pt"

[[block]]
block = "menu"
text = "   "
[[block.items]]
display = " -&gt;   Sleep   &lt;-"
cmd = "systemctl suspend"
[[block.items]]
display = " -&gt; Power Off &lt;-"
cmd = "poweroff"
confirm_msg = "Are you sure you want to power off?"
[[block.items]]
display = " -&gt;  Reboot   &lt;-"
cmd = "reboot"
confirm_msg = "Are you sure you want to reboot?"
