# Picom v13 configuration.
#
# IMPORTANT: since picom v12, when `rules` is set, the legacy per-window
# options (wintypes, opacity-rule, shadow-exclude, rounded-corners-exclude,
# focus-exclude, blur-background-exclude, ...) are IGNORED. All per-window
# behavior therefore lives in the `rules` block below.
#
# Rules are evaluated in order; when several rules match the same window,
# later rules override the options set by earlier ones — keep the generic
# window-type rules first and the specific exclusions last.

#################################
#        Window rules           #
#################################

rules: (
  # Animations for regular windows
  {
    match = "window_type = 'normal' || window_type = 'dialog'";
    animations = (
      {
        triggers = ["open", "show"];
        preset = "appear";       # Options: appear, fly-in, slide-in, zoom
        duration = 0.22;         # Seconds
        scale = 0.92;            # Starts at 92% of the size on 'appear'
      },
      {
        triggers = ["close", "hide"];
        preset = "disappear";    # Options: disappear, fly-out, slide-out, zoom
        duration = 0.18;
        scale = 0.92;
      },
      {
        triggers = ["geometry"]; # Animation when the window changes size/position
        preset = "geometry-change";
        duration = 0.18;
      }
    )
  },

  # Menus and popups: blurred, translucent and noticeably snappier than
  # regular windows (a 0.3s menu feels sluggish).
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu' || "
            "window_type = 'combo' || window_type = 'menu'";
    opacity = 0.95;
    blur-background = true;
    animations = (
      { triggers = ["open", "show"];  preset = "appear";    duration = 0.10; scale = 0.96; },
      { triggers = ["close", "hide"]; preset = "disappear"; duration = 0.08; scale = 0.96; }
    )
  },

  # Unfocused windows are dimmed instead of made 99% opaque: a 1% opacity
  # change is invisible, and any transparency forces picom to blur/blend the
  # whole window. `dim` is cheaper and actually readable as "not focused".
  # Set to 0 to disable, raise towards 0.2 for a stronger effect.
  {
    match = "!focused && !(class_g = 'Brave-browser' || class_g = 'Cairo-clock' || "
            "window_type = 'desktop' || window_type = 'dock')";
    dim = 0.06;
  },

  # Generic window-type settings (former "wintypes")
  {
    match = "window_type = 'tooltip'";
    shadow = true;
    opacity = 0.95;
    focus = true;
    full-shadow = false;
  },
  {
    match = "window_type = 'dock'";
    shadow = false;
    clip-shadow-above = true;
    blur-background = true;   # frosted i3bar (needs an alpha in $barBackground)
  },
  {
    match = "window_type = 'dnd'";
    shadow = false;
  },

  # Blur behind the translucent parts of the rice UI. Fully opaque windows
  # have nothing to blur, so this costs nothing for regular apps.
  {
    match = "class_g = 'Rofi' || class_g = 'Dunst' || class_g = 'eww' || "
            "class_g = 'org.wezfurlong.wezterm' || class_g = 'wezterm' || "
            "class_g = 'dropdown-terminal'";
    blur-background = true;
  },

  # Notifications slide in from the right edge (dunst is anchored top-right).
  {
    match = "class_g = 'Dunst'";
    shadow = true;
    animations = (
      { triggers = ["open", "show"];  preset = "slide-in";  direction = "right"; duration = 0.16; },
      { triggers = ["close", "hide"]; preset = "slide-out"; direction = "right"; duration = 0.16; },
      { triggers = ["geometry"];      preset = "geometry-change"; duration = 0.12; }
    )
  },

  # Windows always treated as focused (never dimmed)
  {
    match = "class_g = 'Cairo-clock' || class_g = 'Brave-browser'";
    focus = true;
  },

  # Screenshot tool: no animations so the capture overlay appears instantly
  {
    match = "name = 'Flameshot*' || class_g = 'flameshot'";
    animations = false;
    shadow = false;
    corner-radius = 0;
    dim = 0;
  },

  # Fullscreen windows (games, video): let X bypass the compositor so they
  # render straight to the screen. See `unredir-if-possible` below.
  {
    match = "_NET_WM_STATE@[*] = '_NET_WM_STATE_FULLSCREEN'";
    corner-radius = 0;
    shadow = false;
    dim = 0;
    unredir = "preferred";
  },

  # Games: hands off entirely. Rounding, dimming, shadows and open/resize
  # animations all cost frames and can confuse a swapchain that is being
  # created or resized. `unredir = "force"` lets the game render straight to
  # the screen with the compositor out of the way.
  {
    match = "class_g ^= 'steam_app_' || class_g = 'gamescope'";
    corner-radius = 0;
    shadow = false;
    dim = 0;
    animations = false;
    # "forced", not "force": picom v13 (rev e5bbe67) prints "force" in its own
    # error message but the parser only accepts "forced".
    unredir = "forced";
  },

  # A tiled window that is alone on its workspace gets no gaps (smart_gaps)
  # and no border (smart_borders), so it sits flush against the screen edges.
  # Rounding it there just bites a corner out of the picture, and its shadow
  # falls off-screen. Only a solo window fills the whole work area: as soon as
  # it shares the workspace, the gaps shrink it to 1910px or less.
  #
  # Floating windows are unaffected — they keep their radius, as does anything
  # smaller than the full work area.
  #
  # Two cases: the normal one (below the 25px bar) and the bar hidden with
  # $mod+Shift+b. Adjust the numbers if you change resolution or bar height.
  {
    match = "width = 1920 && ((y = 25 && height = 1055) || (y = 0 && height = 1080))";
    corner-radius = 0;
    shadow = false;
  },

  # No shadow for notifications, i3 frames, docks and misc overlay windows
  # (includes the Brave tooltip/override_redirect exclusion)
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || class_g = 'i3-frame' || _GTK_FRAME_EXTENTS@ || override_redirect || (class_g = 'Brave-browser' && window_type = 'tooltip')";
    shadow = false;
  },

  # Square corners for bars, docks, desktop and i3 internals
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'i3-frame' || class_g = 'i3-status*' || (name = '' && override_redirect) || _GTK_FRAME_EXTENTS@";
    corner-radius = 0;
  },

  # i3 splits/drag indicators must never be dimmed or animated, otherwise
  # tiling feels laggy.
  {
    match = "class_g = 'i3-frame'";
    dim = 0;
    animations = false;
  }
)

#################################
#           Animations          #
#################################

animations = true;

#################################
#             Blur              #
#################################

# dual_kawase is the best quality/cost ratio and the only method that stays
# cheap at 2x1080p144. Raise `blur-strength` (0-20) for a heavier frost.
# Blur is OFF by default and enabled per-window in the rules block above,
# so opaque apps never pay for it.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

#################################
#            Shadows            #
#################################

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -7;
shadow-offset-y = -7;

# Do not let shadows bleed from one monitor onto the other (dual DP-0/DP-4).
crop-shadow-to-monitor = true;

#################################
#            Fading             #
#################################

fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 4;

#################################
#    Transparency / Opacity     #
#################################

# Per-window opacity (inactive windows etc.) is handled in the rules block.
frame-opacity = 0.98;

#################################
#            Corners            #
#################################

corner-radius = 12;

#################################
#       General settings        #
#################################

# glx performs noticeably better than xrender with animations, shadows and
# rounded corners at 144Hz, especially on NVIDIA. Fall back to "xrender" if
# you hit driver glitches.
backend = "glx";
vsync = true;

# Dithers the final image: removes the banding NVIDIA shows on the gradients
# of blurred/shadowed surfaces. Costs almost nothing on the glx backend.
dithered-present = true;

detect-rounded-corners = false;
detect-client-opacity = true;

# Unredirect fullscreen windows so games/video get the full GPU (no compositor
# in the path). The delay keeps alt-tabbing from flickering: picom only steps
# out after the window has been fullscreen and undisturbed for 3s.
# Set `unredir-if-possible = false` if any flicker comes back.
unredir-if-possible = true;
unredir-if-possible-delay = 3000;

detect-transient = true;
use-damage = true;

log-level = "warn";
