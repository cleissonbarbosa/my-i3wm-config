# Picom v13 configuration.
#
# IMPORTANT: since picom v12, when `rules` is set, the legacy per-window
# options (wintypes, opacity-rule, shadow-exclude, rounded-corners-exclude,
# focus-exclude, blur-background-exclude, ...) are IGNORED. All per-window
# behavior therefore lives in the `rules` block below.
#
# Rules are evaluated in order; when several rules match the same window,
# later rules override the options set by earlier ones — keep the generic
# window-type rules first and the specific exclusions last.

#################################
#        Window rules           #
#################################

rules: (
  # Animations for regular windows
  {
    match = "window_type = 'normal' || window_type = 'dialog' || window_type = 'popup_menu'";
    animations = (
      {
        triggers = ["open", "show"];
        preset = "appear";       # Options: appear, fly-in, slide-in, zoom
        duration = 0.3;          # Seconds
        scale = 0.9;             # Starts at 90% of the size on 'appear'
      },
      {
        triggers = ["close", "hide"];
        preset = "disappear";    # Options: disappear, fly-out, slide-out, zoom
        duration = 0.3;
        scale = 0.9;
      },
      {
        triggers = ["geometry"]; # Animation when the window changes size/position
        preset = "geometry-change";
        duration = 0.2;
      }
    )
  },

  # Slight transparency for unfocused windows (former "inactive-opacity");
  # windows listed in the focus rule below are excluded explicitly.
  {
    match = "!focused && !(class_g = 'Brave-browser' || class_g = 'Cairo-clock')";
    opacity = 0.99;
  },

  # Generic window-type settings (former "wintypes")
  {
    match = "window_type = 'tooltip'";
    shadow = true;
    opacity = 0.95;
    focus = true;
    full-shadow = false;
  },
  {
    match = "window_type = 'dock'";
    shadow = false;
    clip-shadow-above = true;
  },
  {
    match = "window_type = 'dnd'";
    shadow = false;
  },
  {
    match = "window_type = 'popup_menu' || window_type = 'dropdown_menu'";
    opacity = 0.95;
  },

  # Windows always treated as focused (never get the inactive opacity)
  {
    match = "class_g = 'Cairo-clock' || class_g = 'Brave-browser'";
    focus = true;
  },

  # Screenshot tool: no animations so the capture overlay appears instantly
  {
    match = "name = 'Flameshot*'";
    animations = false;
  },

  # No shadow for notifications, i3 frames, docks and misc overlay windows
  # (includes the Brave tooltip/override_redirect exclusion)
  {
    match = "name = 'Notification' || class_g = 'Conky' || class_g ?= 'Notify-osd' || class_g = 'Cairo-clock' || class_g = 'i3-frame' || _GTK_FRAME_EXTENTS@ || override_redirect || (class_g = 'Brave-browser' && window_type = 'tooltip')";
    shadow = false;
  },

  # Square corners for bars, docks, desktop and i3 internals
  {
    match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'i3-frame' || class_g = 'i3-status*' || (name = '' && override_redirect) || _GTK_FRAME_EXTENTS@";
    corner-radius = 0;
  }
)

#################################
#           Animations          #
#################################

animations = true;

#################################
#            Shadows            #
#################################

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.45;
shadow-offset-x = -7;
shadow-offset-y = -7;

#################################
#            Fading             #
#################################

fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 4;

#################################
#    Transparency / Opacity     #
#################################

# Per-window opacity (inactive windows etc.) is handled in the rules block.
frame-opacity = 0.98;

#################################
#            Corners            #
#################################

corner-radius = 12;

#################################
#       General settings        #
#################################

# glx performs noticeably better than xrender with animations, shadows and
# rounded corners at 144Hz, especially on NVIDIA. Fall back to "xrender" if
# you hit driver glitches.
backend = "glx";
vsync = true;

detect-rounded-corners = false;
detect-client-opacity = true;

# Never unredirect fullscreen windows (avoids flicker when alt-tabbing)
unredir-if-possible = false;

detect-transient = true;
use-damage = true;

log-level = "warn";
