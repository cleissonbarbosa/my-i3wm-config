set $backgroundColor #1e1e2e
set $selection #313244
set $comment #6c7086
set $foreground #cdd6f4

set $yellow #f9e2af
set $orange #fab387
set $red #f38ba8
set $magenta #cba6f7
set $blue #89b4fa
set $cyan #89dceb
