[theme]
theme = "ctp-mocha"
[theme.overrides]
# Transparent idle background so the frosted bar shows through: $barBackground
# (themes/<name>/i3.conf) carries an alpha channel and picom blurs the dock,
# but an opaque idle_bg would paint over it and leave only the workspace side
# frosted. Colored states (info/good/warning/critical) keep their pill.
idle_bg = "#00000000"
alternating_tint_bg = "#00000000"
alternating_tint_fg = "#00000000"
separator_bg = "auto"
separator_fg = "auto"
