set $backgroundColor #2e3440
set $selection #3b4252
set $comment #4c566a
set $foreground #d8dee9

set $yellow #ebcb8b
set $orange #d08770
set $red #bf616a
set $magenta #b48ead
set $blue #81a1c1
set $cyan #88c0d0
set $green #a3be8c

# Bar background with alpha (#rrggbbaa) so picom can frost it — see the
# dock rule in picom.conf. Use $backgroundColor here to get an opaque bar.
set $barBackground #2e3440cc
set $accent #88c0d0
