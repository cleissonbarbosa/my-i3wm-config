set $backgroundColor #1a1b26
set $selection #292e42
set $comment #565f89
set $foreground #c0caf5

set $yellow #e0af68
set $orange #ff9e64
set $red #f7768e
set $magenta #bb9af7
set $blue #7aa2f7
set $cyan #7dcfff
set $green #9ece6a

# Bar background with alpha (#rrggbbaa) so picom can frost it — see the
# dock rule in picom.conf. Use $backgroundColor here to get an opaque bar.
set $barBackground #1a1b26cc
set $accent #7aa2f7
